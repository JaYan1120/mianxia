<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="秋日暖阳与山丘的抽象插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e8d4"/>
      <stop offset=".55" stop-color="#ead9be"/>
      <stop offset="1" stop-color="#dfc8a7"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9825f"/>
      <stop offset="1" stop-color="#b64f36"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e997b"/>
      <stop offset="1" stop-color="#6d7962"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f5a4a"/>
      <stop offset="1" stop-color="#7a866b"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
